services:
  db:
    image: postgres:15
    container_name: hporterly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hporterly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - hporterly_pgdata:/var/lib/postgresql/data

  backend:
    image: node:20-alpine
    container_name: hporterly-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hporterly
      JWT_SECRET: supersecret_hporterly_jwt_key_change_me
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run prisma:generate && npm run dev"

  frontend:
    image: node:20-alpine
    container_name: hporterly-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"

volumes:
  hporterly_pgdata:
